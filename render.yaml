services:
  - type: web
    name: threat-sentinel-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: WATCH_DIRECTORY
        value: /app
    rootDir: backend

  - type: web
    name: threat-sentinel-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_URL
        fromService:
          name: threat-sentinel-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    rootDir: frontend
